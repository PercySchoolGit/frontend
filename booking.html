<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UH Sugar Land Student Center - Room Booking</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; color: #333; }
        header { background: #C8102E; color: white; padding: 20px; text-align: center; }
        nav { background: #333; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { padding: 20px; max-width: 600px; margin: auto; background: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #C8102E; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 1em; }
        button:hover { background: #a50d25; }
        .error { color: red; font-size: 0.9em; margin-top: 3px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>Room Booking Form</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="faq.html">FAQ</a>
        <a href="booking.html">Room Booking</a>
        <a href="reference.html">Reference</a>
    </nav>

    <div class="container">
        <h2>Reserve a Room</h2>
        <form id="bookingForm" onsubmit="return validateForm()">
            
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">
                <span id="nameError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="email">UH Email:</label>
                <input type="email" id="email" name="email">
                <span id="emailError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="room">Select Room (5 Options):</label>
                <select id="room" name="room">
                    <option value="">-- Choose a Room --</option>
                    <option value="room101">Room 101 - Small Study Room</option>
                    <option value="room102">Room 102 - Collaboration Hub</option>
                    <option value="room201">Room 201 - Conference Room A</option>
                    <option value="room202">Room 202 - Conference Room B</option>
                    <option value="room301">Room 301 - Large Auditorium Space</option>
                </select>
                <span id="roomError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="date">Booking Date:</label>
                <input type="date" id="date" name="date">
                <span id="dateError" class="error"></span>
            </div>

            <button type="submit">Submit Request</button>
        </form>
    </div>

    <script>
        function validateForm() {
            let isValid = true;

            // Clear previous errors
            document.getElementById('nameError').textContent = "";
            document.getElementById('emailError').textContent = "";
            document.getElementById('roomError').textContent = "";
            document.getElementById('dateError').textContent = "";

            // Get values
            let name = document.getElementById('name').value.trim();
            let email = document.getElementById('email').value.trim();
            let room = document.getElementById('room').value;
            let date = document.getElementById('date').value;

            // Validation checks
            if (name === "") {
                document.getElementById('nameError').textContent = "Please enter your name.";
                isValid = false;
            }

            if (email === "" || !email.endsWith("@uh.edu")) {
                document.getElementById('emailError').textContent = "Please enter a valid UH email ending with @uh.edu.";
                isValid = false;
            }

            if (room === "") {
                document.getElementById('roomError').textContent = "Please select a room.";
                isValid = false;
            }

            if (date === "") {
                document.getElementById('dateError').textContent = "Please select a booking date.";
                isValid = false;
            }

            if (isValid) {
                alert("Form validated successfully! (Backend integration handled later).");
            }

            return isValid; // Prevents form submission if validation fails
        }
    </script>
</body>
</html>
